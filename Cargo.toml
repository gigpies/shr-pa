[package]
name = "shr-pa"
default-run = "shr-pa"
version = "0.2.0-alpha.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false
repository = "https://github.com/gigpies/shr-pa"
description = "Highly experimental Raspberry Pi PA management system"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
alsa = "0.12"
crossterm = "=0.29.0"
hound = "3.5.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
signal-hook = "=0.3.18"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[features]
owner-allocation-guard = []
